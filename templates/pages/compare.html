<!DOCTYPE html>
<html lang="fr">
<head>
<!-- @head -->
    <title>Comparer des races de chiens côte à côte | Race de Chien</title>
    <meta name="description" content="Comparez jusqu'à trois races de chiens sur 20 critères : énergie, enfants, appartement, solitude, éducation, poils, santé.">
    <link rel="canonical" href="https://race-de-chien.com/compare">
    <meta name="robots" content="index, follow">
    <meta name="rdc-data" content="/data/breeds-index.json?v={{V_DATA}}">
</head>
<body class="bg-slate-50 font-sans antialiased text-slate-800">
    <div class="site-header"></div>
    <div class="h-[68px]" aria-hidden="true"></div>

    <main class="max-w-6xl mx-auto min-h-screen px-4 sm:px-6 pb-16">
        <header class="pt-8">
                       <h1 class="display">Comparer des races</h1>
            <p class="mt-2 max-w-2xl text-slate-600">Jusqu'à trois races côte à côte, sur les mêmes 20 critères. Le meilleur score de chaque ligne est mis en avant.</p>
        </header>

        <div class="mt-6 flex flex-col gap-3 sm:flex-row sm:items-center">
            <div class="relative max-w-md flex-1">
                <label for="add" class="sr-only">Ajouter une race</label>
                <input id="add" type="search" list="breed-list" autocomplete="off" placeholder="Ajouter une race…" class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 shadow-sm focus:border-primary-400 focus:outline-none focus:ring-4 focus:ring-primary-100">
                <datalist id="breed-list"></datalist>
            </div>
            <p id="hint" class="text-sm text-slate-500"></p>
        </div>

        <div id="table" class="relative mt-6 overflow-x-auto"></div>
        <div id="empty" class="mt-6 hidden rounded-2xl border border-dashed border-slate-300 bg-white p-8 text-center">
            <p class="text-lg font-bold text-slate-900">Choisissez deux ou trois races</p>
            <p class="mt-1 text-sm text-slate-600">Tapez un nom ci-dessus, ou utilisez le bouton « + Comparer » sur les cartes et les fiches.</p>
            <div id="suggest" class="mt-4 flex flex-wrap justify-center gap-2"></div>
        </div>
    </main>

<!-- @footer -->
    <script src="/js/scoring.js?v={{V_SCORING}}" defer></script>
    <script src="/js/compare.js?v={{V_COMPARE}}" defer></script>
    <script src="/js/header.js?v={{V_HEADER}}" defer></script>
</body>
</html>
