<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, follow">
    <title>Race de Chien</title>
    <script>
        // Ancienne adresse des fiches (breed.html?id=12) : redirection vers /races/<slug>
        (function () {
            var id = new URLSearchParams(location.search).get('id');
            fetch('/data/breed-slugs.json').then(function (r) { return r.json(); }).then(function (map) {
                location.replace(map[id] ? '/races/' + map[id] : '/');
            }).catch(function () { location.replace('/'); });
        })();
    </script>
</head>
<body><p><a href="/">Toutes les races de chiens</a></p></body>
</html>
