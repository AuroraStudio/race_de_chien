name: IndexNow après déploiement

# Vercel publie un « deployment status » sur GitHub à chaque déploiement :
# une fois la production en ligne, on prévient Bing des pages modifiées.
on:
  deployment_status:

jobs:
  indexnow:
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du commit déployé
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Envoyer les pages modifiées à IndexNow
        run: node lib/indexnow.cjs --jours 2
