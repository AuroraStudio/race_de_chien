name: Générer le site statique

on:
  push:
    paths:
      - 'data/breeds.json'
      - 'templates/**'
      - 'js/**'
      - 'css/tailwind.src.css'
      - 'tailwind.config.cjs'
      - 'generate-breeds.cjs'
      - 'lib/**'
      - 'i18n/**'
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installer les dépendances
        run: npm ci

      - name: Générer les pages et le CSS
        run: npm run generate

      - name: Commit et push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A races/ selections/ groupes/ en/ es/ *.html sitemap.xml robots.txt css/site.css data/breeds-index*.json data/lastmod.json js/icons.js js/i18n.*.js
          git diff --staged --quiet || git commit -m "build: régénérer le site statique [auto]"
          git push
