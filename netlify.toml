# race-de-chien.com sur Netlify (équipe Aurora), déployé à chaque push sur main.
# Le site est généré et commité par `npm run generate` (et l'action GitHub « Générer le site statique ») :
# le build ne fait que préparer _site/ (fichiers servis, _redirects), voir lib/publier-netlify.cjs.

[build]
  command = "node lib/publier-netlify.cjs"
  publish = "_site"
  # Pas de build quand le commit ne touche que des fichiers jamais servis (sources, documents, CI).
  # Premier build ou même commit que le dernier (redéploiement manuel) : on construit toujours.
  ignore = "[ -n \"$CACHED_COMMIT_REF\" ] && [ \"$CACHED_COMMIT_REF\" != \"$COMMIT_REF\" ] && git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)sources' ':(exclude).github' ':(exclude).claude' ':(exclude).impeccable' ':(exclude)*.md' ':(exclude).gitignore' ':(exclude).vercelignore' ':(exclude)vercel.json'"

[build.environment]
  NODE_VERSION = "24"

[functions]
  node_bundler = "esbuild"
  # api/match-breed.js (version Vercel, source de la consigne) l'importe en option : absent ici
  external_node_modules = ["@vercel/kv"]

# IndexNow après chaque déploiement de production (remplace .github/workflows/indexnow.yml)
[[plugins]]
  package = "./plugins/indexnow"

# En-têtes repris de vercel.json (pages et fichiers ; la fonction /api/match-breed pose les siens)
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://www.googletagmanager.com https://*.google-analytics.com; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=63072000"

[[headers]]
  for = "/api/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
